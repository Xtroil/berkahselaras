version: "3"
services:
    app:
        build:
            context: ./dockerconf
            dockerfile: Dockerfile
        image: "sakip/app"
        restart: unless-stopped
        tty: true
        environment:
            SERVICE_NAME: app
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./dockerconf/local.ini:/usr/local/etc/php/conf.d/local.ini
            - ./dockerconf/www.conf:/usr/local/etc/php-fpm.d/www.conf

    scheduler:
        image: "sakip/app"
        depends_on: ["app"]
        restart: unless-stopped
        tty: true
        environment:
            SERVICE_NAME: scheduler
            CONTAINER_ROLE: scheduler
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./dockerconf/local.ini:/usr/local/etc/php/conf.d/local.ini
            - ./dockerconf/www.conf:/usr/local/etc/php-fpm.d/www.conf

    #Nginx Service
    webserver:
        image: nginx:alpine
        restart: unless-stopped
        tty: true
        ports:
            - "9024:9024"
        volumes:
            - ./:/var/www
            - ./dockerconf/nginx.app.conf:/etc/nginx/conf.d/app.conf
            - ./dockerconf/nginx.conf:/etc/nginx/nginx.conf
    nuxt:
        image: node:14.15
        user: node
        restart: unless-stopped
        ports:
            - "9023:3000"
        working_dir: /src
        volumes:
            - .:/src
        command: "/bin/sh -c 'yarn start'"

    newrelicdaemon:
        image: newrelic/php-daemon
